[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packagetest"
version = "0.1.0"
description = "OpenStack Ubuntu packaging automation prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
packaging = "packagetest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
