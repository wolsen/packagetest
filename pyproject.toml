[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packagetest"
version = "0.1.0"
description = "OpenStack Ubuntu packaging automation prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["packaging>=24", "PyYAML>=6", "tomlkit>=0.12"]

[project.scripts]
packaging = "packagetest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "packaging_component: exercises a real Debian packaging tool rather than a mocked process boundary",
]

[tool.setuptools.package-data]
packagetest = ["data/*.json"]

[project.optional-dependencies]
dev = ["setuptools>=68", "wheel>=0.45", "pytest>=8", "ruff>=0.17,<0.18", "mypy>=1.9,<2", "radon>=6,<7", "bandit>=1.7,<2", "pip-audit>=2.10,<3", "build>=1.2,<2"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Start with correctness checks across the existing tree; formatting is enforced
# on the new typed boundaries while older modules are migrated incrementally.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
files = [
    "src/packagetest/contracts.py",
    "src/packagetest/relations.py",
    "src/packagetest/prepared_plan.py",
    "src/packagetest/prepared_source.py",
]
strict = true
follow_imports = "silent"
