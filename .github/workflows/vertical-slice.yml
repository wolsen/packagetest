name: openstack-packaging-vertical-slice

on:
  workflow_dispatch:
    inputs:
      openstack_target:
        description: "OpenStack target (e.g. 2026.1)"
        required: true
        default: "2026.1"
      ubuntu_release:
        description: "Ubuntu release codename"
        required: true
        default: "noble"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Create plan artifact
        run: |
          packaging plan \
            --openstack-target "${{ inputs.openstack_target }}" \
            --ubuntu-release "${{ inputs.ubuntu_release }}" \
            glance > plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: packaging-plan
          path: plan.json

  build-pbr:
    needs: [plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with:
          name: packaging-plan
          path: inputs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Install packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts git-buildpackage pristine-tar sbuild apt-utils
      - name: Build pbr
        run: |
          packaging build \
            --openstack-target "${{ inputs.openstack_target }}" \
            --ubuntu-release "${{ inputs.ubuntu_release }}" \
            --no-dependency-closure \
            pbr
      - uses: actions/upload-artifact@v4
        with:
          name: generation-pbr
          path: artifacts/

  build-oslo:
    needs: [build-pbr]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source_package: [python-oslo.i18n, python-oslo.serialization]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with:
          name: packaging-plan
          path: inputs
      - uses: actions/download-artifact@v4.1.3
        with:
          name: generation-pbr
          path: upstream-generation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Install packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts git-buildpackage pristine-tar sbuild apt-utils
      - name: Build oslo package
        run: |
          packaging build \
            --openstack-target "${{ inputs.openstack_target }}" \
            --ubuntu-release "${{ inputs.ubuntu_release }}" \
            --dependency-repo upstream-generation \
            --no-dependency-closure \
            "${{ matrix.source_package }}"
      - uses: actions/upload-artifact@v4
        with:
          name: generation-${{ matrix.source_package }}
          path: artifacts/

  build-glance:
    needs: [build-oslo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with:
          name: packaging-plan
          path: inputs
      - uses: actions/download-artifact@v4.1.3
        with:
          pattern: generation-python-oslo.*
          path: upstream-generation
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Install packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts git-buildpackage pristine-tar sbuild apt-utils
      - name: Build glance
        run: |
          packaging build \
            --openstack-target "${{ inputs.openstack_target }}" \
            --ubuntu-release "${{ inputs.ubuntu_release }}" \
            --dependency-repo upstream-generation \
            --no-dependency-closure \
            glance
      - uses: actions/upload-artifact@v4
        with:
          name: generation-glance
          path: artifacts/
