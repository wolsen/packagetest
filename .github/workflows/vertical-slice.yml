name: openstack-packaging-vertical-slice

on:
  workflow_dispatch:
    inputs:
      openstack_target:
        description: "OpenStack target (e.g. 2026.1)"
        required: true
        default: "2026.1"
      ubuntu_release:
        description: "Ubuntu release codename"
        required: true
        default: "noble"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Create plan artifact
        run: |
          packaging plan \
            --openstack-target "${{ inputs.openstack_target }}" \
            --ubuntu-release "${{ inputs.ubuntu_release }}" \
            glance > plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: packaging-plan
          path: plan.json

  build-pbr:
    needs: [plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with:
          name: packaging-plan
          path: inputs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Install packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts git-buildpackage pristine-tar sbuild apt-utils ubuntu-dev-tools debootstrap
      - name: Prepare sbuild chroot
        run: |
          sudo sbuild-adduser "$USER"
          sudo mkdir -p /srv/chroot
          sudo sbuild-createchroot --arch=amd64 "${{ inputs.ubuntu_release }}" "/srv/chroot/${{ inputs.ubuntu_release }}-amd64" http://archive.ubuntu.com/ubuntu/
      - name: Build pbr
        run: |
          packaging build \
            --openstack-target "${{ inputs.openstack_target }}" \
            --ubuntu-release "${{ inputs.ubuntu_release }}" \
            --no-dependency-closure \
            pbr
      - name: Summarize packaging failures
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failure_files = sorted(Path("artifacts").glob("gen-*/failures/*/failure.json"))
          if not failure_files:
              print("No packaging failure bundles found.")
              raise SystemExit(0)

          print(f"Found {len(failure_files)} packaging failure bundle(s).")
          for failure_file in failure_files:
              try:
                  payload = json.loads(failure_file.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  print(f"- failure_json: {failure_file}")
                  print(f"  parse_error: {exc}")
                  continue
              command = payload.get("command", {})
              print(f"- package: {payload.get('source_package')}")
              print(f"  category: {payload.get('category')}")
              print(f"  failed_command: {' '.join(payload.get('failed_command', []))}")
              print(f"  exit_code: {payload.get('command_exit_code')}")
              print(f"  failure_json: {failure_file}")
              stderr = str(command.get("stderr", "")).strip()
              stdout = str(command.get("stdout", "")).strip()
              if stderr:
                  print("  stderr_tail:")
                  for line in stderr.splitlines()[-30:]:
                      print(f"    {line}")
              elif stdout:
                  print("  stdout_tail:")
                  for line in stdout.splitlines()[-30:]:
                      print(f"    {line}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-pbr
          path: artifacts/

  build-oslo:
    needs: [build-pbr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with:
          name: packaging-plan
          path: inputs
      - uses: actions/download-artifact@v4.1.3
        with:
          name: generation-pbr
          path: upstream-generation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Install packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts git-buildpackage pristine-tar sbuild apt-utils ubuntu-dev-tools debootstrap
      - name: Prepare sbuild chroot
        run: |
          sudo sbuild-adduser "$USER"
          sudo mkdir -p /srv/chroot
          sudo sbuild-createchroot --arch=amd64 "${{ inputs.ubuntu_release }}" "/srv/chroot/${{ inputs.ubuntu_release }}-amd64" http://archive.ubuntu.com/ubuntu/
      - name: Build oslo packages
        run: |
          packaging build \
            --openstack-target "${{ inputs.openstack_target }}" \
            --ubuntu-release "${{ inputs.ubuntu_release }}" \
            --dependency-repo upstream-generation \
            --no-dependency-closure \
            python-oslo.i18n
          packaging build \
            --openstack-target "${{ inputs.openstack_target }}" \
            --ubuntu-release "${{ inputs.ubuntu_release }}" \
            --dependency-repo upstream-generation \
            --no-dependency-closure \
            python-oslo.serialization
      - name: Summarize packaging failures
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failure_files = sorted(Path("artifacts").glob("gen-*/failures/*/failure.json"))
          if not failure_files:
              print("No packaging failure bundles found.")
              raise SystemExit(0)

          print(f"Found {len(failure_files)} packaging failure bundle(s).")
          for failure_file in failure_files:
              try:
                  payload = json.loads(failure_file.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  print(f"- failure_json: {failure_file}")
                  print(f"  parse_error: {exc}")
                  continue
              command = payload.get("command", {})
              print(f"- package: {payload.get('source_package')}")
              print(f"  category: {payload.get('category')}")
              print(f"  failed_command: {' '.join(payload.get('failed_command', []))}")
              print(f"  exit_code: {payload.get('command_exit_code')}")
              print(f"  failure_json: {failure_file}")
              stderr = str(command.get("stderr", "")).strip()
              stdout = str(command.get("stdout", "")).strip()
              if stderr:
                  print("  stderr_tail:")
                  for line in stderr.splitlines()[-30:]:
                      print(f"    {line}")
              elif stdout:
                  print("  stdout_tail:")
                  for line in stdout.splitlines()[-30:]:
                      print(f"    {line}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-python-oslo
          path: artifacts/

  build-glance:
    needs: [build-oslo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.3
        with:
          name: packaging-plan
          path: inputs
      - uses: actions/download-artifact@v4.1.3
        with:
          name: generation-python-oslo
          path: upstream-generation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Install packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts git-buildpackage pristine-tar sbuild apt-utils ubuntu-dev-tools debootstrap
      - name: Prepare sbuild chroot
        run: |
          sudo sbuild-adduser "$USER"
          sudo mkdir -p /srv/chroot
          sudo sbuild-createchroot --arch=amd64 "${{ inputs.ubuntu_release }}" "/srv/chroot/${{ inputs.ubuntu_release }}-amd64" http://archive.ubuntu.com/ubuntu/
      - name: Build glance
        run: |
          packaging build \
            --openstack-target "${{ inputs.openstack_target }}" \
            --ubuntu-release "${{ inputs.ubuntu_release }}" \
            --dependency-repo upstream-generation \
            --no-dependency-closure \
            glance
      - name: Summarize packaging failures
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failure_files = sorted(Path("artifacts").glob("gen-*/failures/*/failure.json"))
          if not failure_files:
              print("No packaging failure bundles found.")
              raise SystemExit(0)

          print(f"Found {len(failure_files)} packaging failure bundle(s).")
          for failure_file in failure_files:
              try:
                  payload = json.loads(failure_file.read_text(encoding="utf-8"))
              except json.JSONDecodeError as exc:
                  print(f"- failure_json: {failure_file}")
                  print(f"  parse_error: {exc}")
                  continue
              command = payload.get("command", {})
              print(f"- package: {payload.get('source_package')}")
              print(f"  category: {payload.get('category')}")
              print(f"  failed_command: {' '.join(payload.get('failed_command', []))}")
              print(f"  exit_code: {payload.get('command_exit_code')}")
              print(f"  failure_json: {failure_file}")
              stderr = str(command.get("stderr", "")).strip()
              stdout = str(command.get("stdout", "")).strip()
              if stderr:
                  print("  stderr_tail:")
                  for line in stderr.splitlines()[-30:]:
                      print(f"    {line}")
              elif stdout:
                  print("  stdout_tail:")
                  for line in stdout.splitlines()[-30:]:
                      print(f"    {line}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generation-glance
          path: artifacts/
