name: OpenStack library packaging
on:
  workflow_dispatch:
    inputs:
      build_case:
        description: Pinned library build
        type: choice
        options: [baseline, update, snapshot]
        default: baseline
        required: true
permissions:
  contents: read
jobs:
  library:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated builder
        env:
          BUILD_CASE: ${{ inputs.build_case }}
        run: |
          target=noble
          if [[ "$BUILD_CASE" == snapshot ]]; then target=stonking; fi
          bash scripts/prepare-builder.sh "$target"
      - name: Build, validate, and install pinned library
        env:
          BUILD_CASE: ${{ inputs.build_case }}
        run: bash scripts/run-library.sh "$BUILD_CASE"
      - name: Summarize failures
        if: always()
        continue-on-error: true
        run: python3 scripts/summarize_packaging_failures.py artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-build
          path: |
            artifacts/gen-*/artifacts/
            artifacts/gen-*/logs/
            artifacts/gen-*/failures/
            artifacts/gen-*/generation-manifest.json
            artifacts/gen-*/build-lock.json
            artifacts/gen-*/smoke-install.json
          if-no-files-found: error
