name: Build one dependency level

on:
  workflow_call:
    inputs:
      packages:
        description: JSON array of source packages in this dependency level
        required: true
        type: string
      plan-artifact:
        description: Artifact containing the frozen catalog and plan
        required: true
        type: string
      autopkgtest-cache-key:
        description: Immutable cache key for the prepared Resolute QEMU image
        required: true
        type: string
      sbuild-cache-key:
        description: Immutable cache key for the updated Resolute sbuild rootfs
        required: true
        type: string
      sbuild-host-cache-key:
        description: Immutable cache key for Noble host packaging tools
        required: true
        type: string
      max-parallel:
        description: Maximum package jobs in this dependency level
        required: true
        type: number
      timeout-minutes:
        description: Timeout for each package build and test job
        required: true
        type: number
      target-id:
        description: Frozen snapshot target identifier used to isolate artifacts
        required: true
        type: string
      suite:
        description: Ubuntu suite used by the autopkgtest image
        required: true
        type: string
      builder-profile:
        description: sbuild profile selected by the frozen target
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  packages:
    name: Build ${{ matrix.source }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        source: ${{ fromJSON(inputs.packages) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      SBUILD_ROOTFS_CACHE: ${{ github.workspace }}/.cache/sbuild/${{ inputs.builder-profile }}-amd64
      SBUILD_HOST_APT_CACHE: ${{ github.workspace }}/.cache/sbuild/ubuntu-24.04-host-tools
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.plan-artifact }}
          path: nightly-plan
      - uses: actions/download-artifact@v4
        with:
          name: prepared-source-${{ inputs.target-id }}-${{ matrix.source }}
          path: outputs/source-preparation
      - id: sbuild_rootfs
        name: Restore updated ${{ inputs.builder-profile }} sbuild rootfs
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SBUILD_ROOTFS_CACHE }}
          key: ${{ inputs.sbuild-cache-key }}
          fail-on-cache-miss: true
      - id: sbuild_host_tools
        name: Restore Noble host packaging tools
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SBUILD_HOST_APT_CACHE }}
          key: ${{ inputs.sbuild-host-cache-key }}
          fail-on-cache-miss: true
      - id: dependencies
        env:
          SOURCE: ${{ matrix.source }}
        run: python3 scripts/nightly-plan.py --catalog nightly-plan/catalog.json --dependency-pattern "$SOURCE"
      - name: Download all required producers through the paginated inventory
        if: steps.dependencies.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PATTERN: ${{ steps.dependencies.outputs.pattern }}
        run: python3 scripts/download-workflow-artifacts.py --pattern "$ARTIFACT_PATTERN" --output downloads --merge-multiple --allow-empty
      - name: Unpack same-run producers
        run: |
          mkdir -p inputs outputs
          for bundle in downloads/*.tar.gz; do
            [ -f "$bundle" ] || continue
            directory="inputs/$(basename "$bundle" .tar.gz)"
            mkdir -p "$directory"
            tar -xzf "$bundle" -C "$directory" --no-same-owner
          done
      - name: Check producers before provisioning builder
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          PYTHONPATH=src python3 scripts/nightly-build.py --check-dependencies-only \
            --source "$SOURCE" --catalog nightly-plan/catalog.json --inputs inputs --output outputs \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - id: builder
        name: Prepare ${{ inputs.builder-profile }} builder
        run: |
          set -o pipefail
          test "${{ steps.sbuild_rootfs.outputs.cache-hit }}" = true
          test "${{ steps.sbuild_host_tools.outputs.cache-hit }}" = true
          test -f "$SBUILD_HOST_APT_CACHE/packages.sha256"
          timeout --signal=TERM --kill-after=30s 25m \
            bash scripts/prepare-builder.sh "${{ inputs.builder-profile }}" 2>&1 | tee outputs/prepare-builder.log
      - name: Build, test, and repair the snapshot
        if: always()
        uses: ./.github/actions/build-test-remediate
        with:
          source: ${{ matrix.source }}
          target-id: ${{ inputs.target-id }}
          suite: ${{ inputs.suite }}
          autopkgtest-cache-key: ${{ inputs.autopkgtest-cache-key }}
          builder-ready: ${{ steps.builder.outcome == 'success' }}
