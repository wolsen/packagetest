name: OpenStack 2026.2 snapshot pipeline
on:
  schedule:
    - cron: '0 9 * * *' # 02:00 America/Phoenix; active on the default branch.
  push:
    branches: [codex/hibiscus-snapshot-pipeline]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      sources:
        description: Comma-separated pilot sources, empty builds the complete catalog
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: hibiscus-snapshots-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sources: ${{ steps.plan.outputs.sources }}
      build_dependency_level_1: ${{ steps.plan.outputs.build_dependency_level_1 }}
      dependency_level_1_enabled: ${{ steps.plan.outputs.dependency_level_1_enabled }}
      build_dependency_level_2: ${{ steps.plan.outputs.build_dependency_level_2 }}
      dependency_level_2_enabled: ${{ steps.plan.outputs.dependency_level_2_enabled }}
      build_dependency_level_3: ${{ steps.plan.outputs.build_dependency_level_3 }}
      dependency_level_3_enabled: ${{ steps.plan.outputs.dependency_level_3_enabled }}
      build_dependency_level_4: ${{ steps.plan.outputs.build_dependency_level_4 }}
      dependency_level_4_enabled: ${{ steps.plan.outputs.dependency_level_4_enabled }}
      build_dependency_level_5: ${{ steps.plan.outputs.build_dependency_level_5 }}
      dependency_level_5_enabled: ${{ steps.plan.outputs.dependency_level_5_enabled }}
      build_dependency_level_6: ${{ steps.plan.outputs.build_dependency_level_6 }}
      dependency_level_6_enabled: ${{ steps.plan.outputs.dependency_level_6_enabled }}
      build_dependency_level_7: ${{ steps.plan.outputs.build_dependency_level_7 }}
      dependency_level_7_enabled: ${{ steps.plan.outputs.dependency_level_7_enabled }}
      build_dependency_level_8: ${{ steps.plan.outputs.build_dependency_level_8 }}
      dependency_level_8_enabled: ${{ steps.plan.outputs.dependency_level_8_enabled }}
      build_dependency_level_9: ${{ steps.plan.outputs.build_dependency_level_9 }}
      dependency_level_9_enabled: ${{ steps.plan.outputs.dependency_level_9_enabled }}
      build_dependency_level_10: ${{ steps.plan.outputs.build_dependency_level_10 }}
      dependency_level_10_enabled: ${{ steps.plan.outputs.dependency_level_10_enabled }}
      build_dependency_level_11: ${{ steps.plan.outputs.build_dependency_level_11 }}
      dependency_level_11_enabled: ${{ steps.plan.outputs.dependency_level_11_enabled }}
      build_dependency_level_12: ${{ steps.plan.outputs.build_dependency_level_12 }}
      dependency_level_12_enabled: ${{ steps.plan.outputs.dependency_level_12_enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stop superseded runs of this feature pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cancel-superseded-runs.py
      - id: plan
        env:
          SOURCES: ${{ inputs.sources }}
        run: python3 scripts/nightly-plan.py --sources "$SOURCES"
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-plan
          path: nightly-plan/
          retention-days: 14
          if-no-files-found: error

  build_dependency_level_1:
    name: Build ${{ matrix.source }}
    needs: [plan]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.dependency_level_1_enabled == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.build_dependency_level_1) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nightly-plan
          path: nightly-plan
      - id: dependencies
        env:
          SOURCE: ${{ matrix.source }}
        run: python3 scripts/nightly-plan.py --catalog nightly-plan/catalog.json --dependency-pattern "$SOURCE"
      - uses: actions/download-artifact@v4
        if: steps.dependencies.outputs.needed == 'true'
        with:
          pattern: ${{ steps.dependencies.outputs.pattern }}
          path: downloads
          merge-multiple: true
      - name: Unpack same-run producers
        run: |
          mkdir -p inputs outputs
          for bundle in downloads/*.tar.gz; do
            [ -f "$bundle" ] || continue
            directory="inputs/$(basename "$bundle" .tar.gz)"
            mkdir -p "$directory"
            tar -xzf "$bundle" -C "$directory" --no-same-owner
          done
      - name: Check producers before provisioning builder
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          PYTHONPATH=src python3 scripts/nightly-build.py --check-dependencies-only \
            --source "$SOURCE" --catalog nightly-plan/catalog.json --inputs inputs --output outputs \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Prepare Resolute builder
        run: |
          set -o pipefail
          bash scripts/prepare-builder.sh resolute 2>&1 | tee outputs/prepare-builder.log
      - name: Build snapshot against this run's producers
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          set -o pipefail
          sg sbuild -c 'PYTHONPATH=src python3 scripts/nightly-build.py \
            --source "$SOURCE" --catalog nightly-plan/catalog.json --inputs inputs --output outputs \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"' 2>&1 | tee outputs/nightly-build.log
      - name: Bundle packages and complete failure evidence
        if: always()
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          mkdir -p outputs bundles
          sudo tar --exclude=work --exclude='source-preparation/*/checkout' --exclude='source-preparation/*/venv' --exclude='*.qcow2' -czf "bundles/$SOURCE.tar.gz" -C outputs .
          sudo chmod a+r "bundles/$SOURCE.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.source }}
          path: bundles/*.tar.gz
          retention-days: 14
          if-no-files-found: error
      - name: Record infrastructure failures without a build manifest
        if: always()
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          mkdir -p outputs
          if [ ! -f outputs/result.json ]; then
            SOURCE="$SOURCE" python3 -c 'import json,os; open("outputs/result.json", "w").write(json.dumps({"source":os.environ["SOURCE"],"result":"INFRA_ERROR","error":"Build did not reach executor; inspect job logs"}))'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status-build-${{ matrix.source }}
          path: outputs/result.json
          retention-days: 14
          if-no-files-found: error
      - name: Test installed snapshot package
        if: always()
        uses: ./.github/actions/test-built-snapshot
        with:
          source: ${{ matrix.source }}
