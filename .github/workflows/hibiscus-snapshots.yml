name: OpenStack 2026.2 snapshot pipeline
on:
  schedule:
    - cron: '0 9 * * *' # 02:00 America/Phoenix; active on the default branch.
  push:
    branches: [main]
    paths:
      - '.github/actions/build-test-remediate/**'
      - '.github/workflows/build-dependency-level.yml'
      - '.github/workflows/hibiscus-snapshots.yml'
      - 'config/**'
      - 'scripts/**'
      - 'src/**'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      sources:
        description: Comma-separated pilot sources, empty builds the complete catalog
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: hibiscus-snapshots-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sources: ${{ steps.plan.outputs.sources }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install catalog and planning dependencies
        run: python3 -m pip install .
      - name: Stop superseded snapshot pipeline runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cancel-superseded-runs.py
      - name: Generate and preflight the current Resolute catalog
        run: >-
          PYTHONPATH=src python3 scripts/generate-nightly-catalog.py
          --output "$RUNNER_TEMP/catalog-input.json"
          --workspace "$RUNNER_TEMP/catalog-discovery"
      - id: plan
        env:
          # Pushes validate a representative dependency closure. Scheduled runs
          # and an empty manual dispatch select the complete catalog.
          SOURCES: ${{ github.event_name == 'push' && 'python-neutron-lib,python-oslo.versionedobjects,heat,watcher,glance' || inputs.sources }}
        run: >-
          python3 scripts/nightly-plan.py
          --catalog "$RUNNER_TEMP/catalog-input.json"
          --discovery-only
          --sources "$SOURCES"
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-discovery
          path: nightly-plan/
          retention-days: 14
          if-no-files-found: error

  prepare_autopkgtest_image:
    name: Prepare cached Resolute autopkgtest image
    needs: [plan]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      cache_key: ${{ steps.identity.outputs.key }}
    env:
      AUTOPKGTEST_IMAGE_CACHE: ${{ github.workspace }}/.cache/autopkgtest/resolute-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: identity
        name: Resolve published Resolute image identity
        run: scripts/autopkgtest-cache-key.sh resolute amd64
      - id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.AUTOPKGTEST_IMAGE_CACHE }}
          key: ${{ steps.identity.outputs.key }}
      - name: Build pristine test image on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/prepare-autopkgtest.sh resolute "$RUNNER_TEMP/autopkgtest-image"
      - name: Verify cached image checksum
        run: |
          cd "$AUTOPKGTEST_IMAGE_CACHE"
          sha256sum --check autopkgtest-resolute-amd64.img.sha256

  prepare_sbuild_rootfs:
    name: Prepare cached Resolute builder inputs
    needs: [plan]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      cache_key: ${{ steps.identity.outputs.key }}
      host_cache_key: ${{ steps.identity.outputs.key }}-host-tools
    env:
      SBUILD_ROOTFS_CACHE: ${{ github.workspace }}/.cache/sbuild/resolute-amd64
      SBUILD_HOST_APT_CACHE: ${{ github.workspace }}/.cache/sbuild/ubuntu-24.04-host-tools
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: identity
        name: Resolve sbuild rootfs identity
        run: scripts/sbuild-cache-key.sh resolute amd64
      - id: rootfs_cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SBUILD_ROOTFS_CACHE }}
          key: ${{ steps.identity.outputs.key }}
      - id: host_cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SBUILD_HOST_APT_CACHE }}
          key: ${{ steps.identity.outputs.key }}-host-tools
      - name: Cache updated source chroot and Noble host tools
        if: steps.rootfs_cache.outputs.cache-hit != 'true' || steps.host_cache.outputs.cache-hit != 'true'
        run: bash scripts/prepare-builder.sh resolute
      - name: Verify cached builder inputs
        run: |
          cd "$SBUILD_ROOTFS_CACHE"
          sha256sum --check resolute-amd64-sbuild.tar.gz.sha256
          cd "$SBUILD_HOST_APT_CACHE"
          sha256sum --check packages.sha256

  prepare_sources:
    name: Prepare ${{ matrix.source }} source
    needs: [plan, prepare_sbuild_rootfs, prepare_local_ai]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.prepare_sbuild_rootfs.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.sources) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SBUILD_HOST_APT_CACHE: ${{ github.workspace }}/.cache/sbuild/ubuntu-24.04-host-tools
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nightly-discovery
          path: nightly-discovery
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.SBUILD_HOST_APT_CACHE }}
          key: ${{ needs.prepare_sbuild_rootfs.outputs.host_cache_key }}
          fail-on-cache-miss: true
      - name: Install pinned source preparation tools
        env:
          PACKAGETEST_HOST_TOOLS_ONLY: 1
        run: bash scripts/prepare-builder.sh resolute
      - id: initial_source
        name: Prepare immutable snapshot source
        continue-on-error: true
        env:
          SOURCE: ${{ matrix.source }}
        run: >-
          PYTHONPATH=src python3 scripts/prepare-nightly-source.py
          --catalog nightly-discovery/catalog.json
          --source "$SOURCE"
          --work "$RUNNER_TEMP/source-preparation-$SOURCE"
          --output prepared-source
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
      - id: ai_cache
        name: Restore local AI for source packaging adaptation
        if: steps.initial_source.outcome == 'failure'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.cache/packagetest-ai
          key: local-ai-llama-b10964-qwen25-coder-7b-q4km-v1
          fail-on-cache-miss: true
      - name: Analyze and retry failed source packaging
        if: steps.initial_source.outcome == 'failure'
        env:
          SOURCE: ${{ matrix.source }}
          AI_CACHE: ${{ github.workspace }}/.cache/packagetest-ai
          MODEL_SHA256: 509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c
        run: |
          llama_cli="$(find "$AI_CACHE/runtime" -type f -name llama-cli -print -quit)"
          PYTHONPATH=src python3 scripts/remediate-source-preparation.py \
            --source "$SOURCE" --catalog nightly-discovery/catalog.json \
            --initial-work "$RUNNER_TEMP/source-preparation-$SOURCE" \
            --output prepared-source --report "source-remediation/$SOURCE" \
            --work "$RUNNER_TEMP/source-remediation-$SOURCE" \
            --llama-cli "$llama_cli" --model "$AI_CACHE/model.gguf" \
            --model-sha256 "$MODEL_SHA256" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Add source evolution to the job summary
        if: always() && hashFiles('prepared-source/packaging-proposal/source-evolution.md') != ''
        run: cat prepared-source/packaging-proposal/source-evolution.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-source-${{ matrix.source }}
          path: prepared-source/
          retention-days: 14
          if-no-files-found: error
      - name: Require a prepared or successfully repaired source
        if: always()
        run: test -f prepared-source/prepared-source.json

  finalize_plan:
    name: Build exact dependency plan from prepared sources
    needs: [plan, prepare_sources]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.prepare_sources.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      dependency_levels: ${{ steps.finalize.outputs.dependency_levels }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nightly-discovery
          path: nightly-discovery
      - uses: actions/download-artifact@v4
        with:
          pattern: prepared-source-*
          path: prepared-inputs
      - id: finalize
        name: Resolve exact binary providers and dependency levels
        run: >-
          PYTHONPATH=src python3 scripts/finalize-nightly-plan.py
          --catalog nightly-discovery/catalog.json
          --prepared-inputs prepared-inputs
          --output nightly-plan
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-plan
          path: nightly-plan/
          retention-days: 14
          if-no-files-found: error

  build_dependency_levels:
    name: Dependency level ${{ matrix.level }}
    needs: [finalize_plan, prepare_autopkgtest_image, prepare_sbuild_rootfs, prepare_local_ai]
    if: ${{ always() && !cancelled() && needs.finalize_plan.result == 'success' && needs.prepare_autopkgtest_image.result == 'success' && needs.prepare_sbuild_rootfs.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.finalize_plan.outputs.dependency_levels) }}
    uses: ./.github/workflows/build-dependency-level.yml
    with:
      packages: ${{ matrix.packages }}
      plan-artifact: nightly-plan
      autopkgtest-cache-key: ${{ needs.prepare_autopkgtest_image.outputs.cache_key }}
      sbuild-cache-key: ${{ needs.prepare_sbuild_rootfs.outputs.cache_key }}
      sbuild-host-cache-key: ${{ needs.prepare_sbuild_rootfs.outputs.host_cache_key }}
      max-parallel: 20
      timeout-minutes: 360

  summary:
    name: Summarize all package and test results
    needs: [finalize_plan, build_dependency_levels]
    if: ${{ always() && !cancelled() && needs.finalize_plan.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nightly-plan
          path: nightly-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: status-*
          path: statuses
      - name: Download proposed packaging changes
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: packaging-proposal-*
          path: proposals
      - name: Aggregate every requested source without hiding missing jobs
        run: python3 scripts/nightly-plan.py --catalog nightly-plan/catalog.json --summary-inputs statuses --output summary
      - name: Render static pipeline report
        run: |
          python3 scripts/render-pipeline-report.py \
            --catalog nightly-plan/catalog.json \
            --plan nightly-plan/plan.json \
            --results summary/results.json \
            --proposals proposals \
            --output summary \
            --target-id ubuntu-resolute-development \
            --target-kind development \
            --base-series resolute \
            --suite resolute \
            --architecture amd64
      - id: pipeline_summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-summary
          path: summary/
          retention-days: 14
          if-no-files-found: error
      - name: Link the browsable report
        if: ${{ always() && steps.pipeline_summary.outputs.artifact-url != '' }}
        env:
          REPORT_URL: ${{ steps.pipeline_summary.outputs.artifact-url }}
        run: |
          echo "## Browsable pipeline report" >> "$GITHUB_STEP_SUMMARY"
          printf 'Download [pipeline-summary](%s), extract it, and open `index.html`.\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"

  prepare_local_ai:
    name: Prepare pinned local AI runtime
    needs: [plan]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AI_CACHE: ${{ github.workspace }}/.cache/packagetest-ai
      LLAMA_URL: https://github.com/ggml-org/llama.cpp/releases/download/b10964/llama-b10964-bin-ubuntu-x64.tar.gz
      LLAMA_SHA256: 9abf88aea48a55d0f80edb1ee20220b186848cca0b4e919d71518cfd7ca67443
      MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/13fb94bfda8c8cf22497dc57b78f391a9acb426a/qwen2.5-coder-7b-instruct-q4_k_m.gguf
      MODEL_SHA256: 509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c
    steps:
      - id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.AI_CACHE }}
          key: local-ai-llama-b10964-qwen25-coder-7b-q4km-v1
      - name: Download and verify runtime and model
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p "$AI_CACHE/runtime"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/llama.tar.gz" "$LLAMA_URL"
          echo "$LLAMA_SHA256  $RUNNER_TEMP/llama.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/llama.tar.gz" -C "$AI_CACHE/runtime"
          curl --fail --location --retry 3 --output "$AI_CACHE/model.gguf" "$MODEL_URL"
          echo "$MODEL_SHA256  $AI_CACHE/model.gguf" | sha256sum --check
          test -x "$(find "$AI_CACHE/runtime" -type f -name llama-cli -print -quit)"
      - name: Validate cached files and run an actual model smoke test
        run: |
          set -euxo pipefail
          echo "$MODEL_SHA256  $AI_CACHE/model.gguf" | sha256sum --check
          llama_cli="$(find "$AI_CACHE/runtime" -type f -name llama-cli -print -quit)"
          test -x "$llama_cli"
          runtime_dir="$(dirname "$llama_cli")"
          LD_LIBRARY_PATH="$runtime_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$llama_cli" --version
          timeout 300 env LD_LIBRARY_PATH="$runtime_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"             "$llama_cli" -m "$AI_CACHE/model.gguf" -p 'Reply with READY.' -n 8 -c 2048             --temp 0 --seed 1 --threads 2 --no-display-prompt --single-turn --simple-io             --no-show-timings > "$RUNNER_TEMP/model-smoke.txt"
          grep -q '[Rr][Ee][Aa][Dd][Yy]' "$RUNNER_TEMP/model-smoke.txt"
