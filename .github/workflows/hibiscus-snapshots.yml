name: OpenStack 2026.2 snapshot pipeline
on:
  schedule:
    - cron: '0 9 * * *' # 02:00 America/Phoenix; active on the default branch.
  push:
    branches: [main]
    paths:
      - '.github/actions/build-test-remediate/**'
      - '.github/workflows/build-dependency-level.yml'
      - '.github/workflows/openstack-snapshot-target.yml'
      - '.github/workflows/hibiscus-snapshots.yml'
      - 'config/**'
      - 'scripts/**'
      - 'src/**'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      sources:
        description: Comma-separated pilot sources, empty builds the complete catalog
        type: string
        default: ''
      target:
        description: Snapshot target to run
        type: choice
        options: [all, hibiscus-stonking, hibiscus-resolute-uca]
        default: all
permissions:
  contents: read
  actions: read
concurrency:
  group: hibiscus-snapshots-v3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stonking:
    name: Ubuntu Stonking development
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'hibiscus-stonking' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/openstack-snapshot-target.yml
    with:
      target-id: hibiscus-stonking
      target-label: Ubuntu Stonking development
      sources: ${{ github.event_name == 'push' && 'python-neutron-lib,python-oslo.versionedobjects,heat,watcher,glance' || inputs.sources }}

  resolute_uca:
    name: Resolute UCA Hibiscus
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'hibiscus-resolute-uca' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/openstack-snapshot-target.yml
    with:
      target-id: hibiscus-resolute-uca
      target-label: Resolute UCA Hibiscus
      sources: ${{ github.event_name == 'push' && 'python-neutron-lib,python-oslo.versionedobjects,heat,watcher,glance' || inputs.sources }}
