name: OpenStack 2026.2 Ubuntu Stonking snapshots
on:
  schedule:
    - cron: '0 9 * * *' # 02:00 America/Phoenix; active on the default branch.
  push:
    branches: [main]
    paths:
      - '.github/actions/build-test-remediate/**'
      - '.github/workflows/build-dependency-level.yml'
      - '.github/workflows/openstack-snapshot-target.yml'
      - '.github/workflows/hibiscus-snapshots.yml'
      - 'config/**'
      - 'scripts/**'
      - 'src/**'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      sources:
        description: Comma-separated pilot sources, empty builds the complete catalog
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: hibiscus-stonking-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stonking:
    name: Ubuntu Stonking development
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/openstack-snapshot-target.yml
    with:
      target-id: hibiscus-stonking
      target-label: Ubuntu Stonking development
      sources: ${{ github.event_name == 'push' && 'python-neutron-lib,python-oslo.versionedobjects,python-debtcollector,python-oslo.i18n,python-os-service-types,heat,watcher,glance' || inputs.sources }}
