  summary:
    name: Summarize all package and test results
    needs: [plan, build_dependency_level_1, build_dependency_level_2, build_dependency_level_3, build_dependency_level_4, build_dependency_level_5, build_dependency_level_6, build_dependency_level_7, build_dependency_level_8, build_dependency_level_9, build_dependency_level_10, build_dependency_level_11, build_dependency_level_12]
