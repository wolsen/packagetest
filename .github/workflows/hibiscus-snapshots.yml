name: OpenStack 2026.2 snapshot pipeline
on:
  push:
    branches: [codex/hibiscus-snapshot-pipeline]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      sources:
        description: Comma-separated pilot sources, empty builds the complete catalog
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: hibiscus-snapshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sources: ${{ steps.plan.outputs.sources }}
      wave0: ${{ steps.plan.outputs.wave0 }}
      enabled0: ${{ steps.plan.outputs.enabled0 }}
      wave1: ${{ steps.plan.outputs.wave1 }}
      enabled1: ${{ steps.plan.outputs.enabled1 }}
      wave2: ${{ steps.plan.outputs.wave2 }}
      enabled2: ${{ steps.plan.outputs.enabled2 }}
      wave3: ${{ steps.plan.outputs.wave3 }}
      enabled3: ${{ steps.plan.outputs.enabled3 }}
      wave4: ${{ steps.plan.outputs.wave4 }}
      enabled4: ${{ steps.plan.outputs.enabled4 }}
      wave5: ${{ steps.plan.outputs.wave5 }}
      enabled5: ${{ steps.plan.outputs.enabled5 }}
      wave6: ${{ steps.plan.outputs.wave6 }}
      enabled6: ${{ steps.plan.outputs.enabled6 }}
      wave7: ${{ steps.plan.outputs.wave7 }}
      enabled7: ${{ steps.plan.outputs.enabled7 }}
      wave8: ${{ steps.plan.outputs.wave8 }}
      enabled8: ${{ steps.plan.outputs.enabled8 }}
      wave9: ${{ steps.plan.outputs.wave9 }}
      enabled9: ${{ steps.plan.outputs.enabled9 }}
      wave10: ${{ steps.plan.outputs.wave10 }}
      enabled10: ${{ steps.plan.outputs.enabled10 }}
      wave11: ${{ steps.plan.outputs.wave11 }}
      enabled11: ${{ steps.plan.outputs.enabled11 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: plan
        env:
          SOURCES: ${{ inputs.sources }}
        run: python3 scripts/nightly-plan.py --sources "$SOURCES"
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-plan
          path: nightly-plan/
          retention-days: 14
          if-no-files-found: error

  wave0:
    needs: [plan]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.enabled0 == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.wave0) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nightly-plan
          path: nightly-plan
      - id: dependencies
        env:
          SOURCE: ${{ matrix.source }}
        run: python3 scripts/nightly-plan.py --catalog nightly-plan/catalog.json --dependency-pattern "$SOURCE"
      - uses: actions/download-artifact@v4
        if: steps.dependencies.outputs.needed == 'true'
        with:
          pattern: ${{ steps.dependencies.outputs.pattern }}
          path: downloads
          merge-multiple: true
      - name: Unpack same-run producers
        run: |
          mkdir -p inputs outputs
          for bundle in downloads/*.tar.gz; do
            [ -f "$bundle" ] || continue
            directory="inputs/$(basename "$bundle" .tar.gz)"
            mkdir -p "$directory"
            tar -xzf "$bundle" -C "$directory" --no-same-owner
          done
      - name: Check producers before provisioning builder
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          PYTHONPATH=src python3 scripts/nightly-build.py --check-dependencies-only \
            --source "$SOURCE" --catalog nightly-plan/catalog.json --inputs inputs --output outputs \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Prepare Resolute builder
        run: |
          set -o pipefail
          bash scripts/prepare-builder.sh resolute 2>&1 | tee outputs/prepare-builder.log
      - name: Build snapshot against this run's producers
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          set -o pipefail
          sg sbuild -c 'PYTHONPATH=src python3 scripts/nightly-build.py \
            --source "$SOURCE" --catalog nightly-plan/catalog.json --inputs inputs --output outputs \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"' 2>&1 | tee outputs/nightly-build.log
      - name: Bundle packages and complete failure evidence
        if: always()
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          mkdir -p outputs bundles
          sudo tar --exclude=work --exclude='source-preparation/*/checkout' --exclude='source-preparation/*/venv' --exclude='*.qcow2' -czf "bundles/$SOURCE.tar.gz" -C outputs .
          sudo chmod a+r "bundles/$SOURCE.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.source }}
          path: bundles/*.tar.gz
          retention-days: 14
          if-no-files-found: error
      - name: Record infrastructure failures without a build manifest
        if: always()
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          mkdir -p outputs
          if [ ! -f outputs/result.json ]; then
            SOURCE="$SOURCE" python3 -c 'import json,os; open("outputs/result.json", "w").write(json.dumps({"source":os.environ["SOURCE"],"result":"INFRA_ERROR","error":"Build did not reach executor; inspect job logs"}))'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: status-build-${{ matrix.source }}
          path: outputs/result.json
          retention-days: 14
          if-no-files-found: error
