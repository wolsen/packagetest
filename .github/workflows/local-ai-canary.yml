name: Local AI packaging repair canary
# Changes here intentionally start only the focused structured-repair canary.
# The push selection exercises snapshot metadata, guarded adaptations, and quilt refreshes.

on:
  push:
    branches: [codex/hibiscus-snapshot-pipeline]
    paths: [.github/workflows/local-ai-canary.yml]
  workflow_dispatch:
    inputs:
      sources:
        description: Comma-separated subset of the reviewed repair canaries
        type: string
        default: aetos

permissions:
  contents: read
  actions: read

concurrency:
  group: local-ai-repair-canary-${{ github.ref }}
  cancel-in-progress: true

env:
  AI_CACHE: ${{ github.workspace }}/.cache/packagetest-ai
  LLAMA_URL: https://github.com/ggml-org/llama.cpp/releases/download/b10964/llama-b10964-bin-ubuntu-x64.tar.gz
  LLAMA_SHA256: 9abf88aea48a55d0f80edb1ee20220b186848cca0b4e919d71518cfd7ca67443
  MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/13fb94bfda8c8cf22497dc57b78f391a9acb426a/qwen2.5-coder-7b-instruct-q4_k_m.gguf
  MODEL_SHA256: 509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c

jobs:
  plan:
    name: Plan focused repair canary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sources: ${{ steps.plan.outputs.sources }}
      build_dependency_level_1: ${{ steps.plan.outputs.build_dependency_level_1 }}
      dependency_level_1_enabled: ${{ steps.plan.outputs.dependency_level_1_enabled }}
      build_dependency_level_2: ${{ steps.plan.outputs.build_dependency_level_2 }}
      dependency_level_2_enabled: ${{ steps.plan.outputs.dependency_level_2_enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restrict the canary to reviewed cases
        env:
          SOURCES: ${{ inputs.sources || 'python-oslo.versionedobjects,ironic,heat-tempest-plugin,telemetry-tempest-plugin' }}
        run: |
          python3 - <<'PY'
          import os
          allowed = {"aetos", "watcher", "python-glance-store", "networking-generic-switch",
                     "python-oslo.versionedobjects", "ironic", "heat-tempest-plugin",
                     "telemetry-tempest-plugin"}
          requested = {item.strip() for item in os.environ["SOURCES"].split(",") if item.strip()}
          if not requested or requested - allowed:
              raise SystemExit(f"Choose one or more of {sorted(allowed)}; got {sorted(requested)}")
          PY
      - id: plan
        env:
          SOURCES: ${{ inputs.sources || 'python-oslo.versionedobjects,ironic,heat-tempest-plugin,telemetry-tempest-plugin' }}
        run: python3 scripts/nightly-plan.py --sources "$SOURCES"
      - uses: actions/upload-artifact@v4
        with:
          name: ai-canary-plan
          path: nightly-plan/
          retention-days: 7
          if-no-files-found: error

  prepare_model:
    name: Prepare and contract-test local model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.AI_CACHE }}
          key: local-ai-llama-b10964-qwen25-coder-7b-q4km-v1
      - name: Download and verify pinned runtime
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p "$AI_CACHE/runtime"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/llama.tar.gz" "$LLAMA_URL"
          echo "$LLAMA_SHA256  $RUNNER_TEMP/llama.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/llama.tar.gz" -C "$AI_CACHE/runtime"
          curl --fail --location --retry 3 --output "$AI_CACHE/model.gguf" "$MODEL_URL"
          echo "$MODEL_SHA256  $AI_CACHE/model.gguf" | sha256sum --check
      - id: contract
        name: Exercise real output parsing and patch validation
        continue-on-error: true
        run: |
          set -euxo pipefail
          echo "$MODEL_SHA256  $AI_CACHE/model.gguf" | sha256sum --check
          llama_cli="$(find "$AI_CACHE/runtime" -type f -name llama-cli -print -quit)"
          test -x "$llama_cli"
          mkdir -p "$RUNNER_TEMP/contract/debian/patches" "$RUNNER_TEMP/contract/etc/aodh"
          cat > "$RUNNER_TEMP/contract/debian/control" <<'EOF'
          Source: sample
          Build-Depends: debhelper-compat (= 13),
          Build-Depends-Indep:
           python3-pbr,

          Package: python3-sample
          Architecture: all
          Depends:
           ${python3:Depends},
          EOF
          python3 - <<'PY'
          import os
          from pathlib import Path
          continuation = "\\"
          lines = [
              "#!/usr/bin/make -f",
              "override_dh_install:",
              "\toslopolicy-sample-generator " + continuation,
              "\t--output-file debian/sample.yaml " + continuation,
              "\t--format yaml " + continuation,
              "\t--namespace sample",
              "\toslo-config-generator --config-file=aodh/cmd/aodh-config-generator.conf",
          ]
          Path(os.environ["RUNNER_TEMP"], "contract/debian/rules").write_text("\n".join(lines) + "\n")
          Path(os.environ["RUNNER_TEMP"], "contract/debian/patches/series").write_text(
              "context-only.patch\nembedded-xstatic.patch\n")
          Path(os.environ["RUNNER_TEMP"], "contract/debian/patches/context-only.patch").write_text(
              "diff --git a/sample.txt b/sample.txt\n"
              "--- a/sample.txt\n+++ b/sample.txt\n@@ -1,4 +1,4 @@\n heading\n keep\n-old\n+new\n tail\n")
          Path(os.environ["RUNNER_TEMP"], "contract/sample.txt").write_text(
              "changed heading\nkeep\nold\ntail\n")
          Path(os.environ["RUNNER_TEMP"], "contract/etc/aodh/aodh-config-generator.conf").write_text(
              "[DEFAULT]\n")
          PY
          PYTHONPATH=src python3 scripts/model-contract-test.py \
            --tree "$RUNNER_TEMP/contract" --llama-cli "$llama_cli" \
            --model "$AI_CACHE/model.gguf" --output "$RUNNER_TEMP/model-contract"
      - name: Publish contract decisions even when validation fails
        if: always()
        run: |
          {
            echo '## Local model contract decisions'
            find "$RUNNER_TEMP/model-contract" -type f \
              \( -name decision.json -o -name result.json \) -print -exec cat {} \; 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-ai-contract-output
          path: ${{ runner.temp }}/model-contract/
          retention-days: 7
          if-no-files-found: warn
      - name: Enforce the model contract
        if: always()
        env:
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
        run: test "$CONTRACT_OUTCOME" = success

  repair_dependency_level_1:
    name: Build ${{ matrix.source }}
    needs: [plan, prepare_model]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.prepare_model.result == 'success' && needs.plan.outputs.dependency_level_1_enabled == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.build_dependency_level_1) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ai-canary-plan
          path: nightly-plan
      - id: dependencies
        env:
          SOURCE: ${{ matrix.source }}
        run: python3 scripts/nightly-plan.py --catalog nightly-plan/catalog.json --dependency-pattern "$SOURCE"
      - uses: actions/download-artifact@v4
        if: steps.dependencies.outputs.needed == 'true'
        with:
          pattern: ${{ steps.dependencies.outputs.pattern }}
          path: downloads
          merge-multiple: true
      - name: Unpack same-run producers
        run: |
          mkdir -p inputs outputs
          for bundle in downloads/*.tar.gz; do
            [ -f "$bundle" ] || continue
            directory="inputs/$(basename "$bundle" .tar.gz)"
            mkdir -p "$directory"
            tar -xzf "$bundle" -C "$directory" --no-same-owner
          done
      - name: Check producers before provisioning builder
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          PYTHONPATH=src python3 scripts/nightly-build.py --check-dependencies-only \
            --source "$SOURCE" --catalog nightly-plan/catalog.json --inputs inputs --output outputs \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Prepare Resolute builder
        run: |
          set -o pipefail
          bash scripts/prepare-builder.sh resolute 2>&1 | tee outputs/prepare-builder.log
      - name: Build, test, and attempt up to three local repairs
        uses: ./.github/actions/build-test-remediate
        with:
          source: ${{ matrix.source }}

  repair_dependency_level_2:
    name: Build ${{ matrix.source }}
    needs: [plan, prepare_model, repair_dependency_level_1]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.prepare_model.result == 'success' && needs.plan.outputs.dependency_level_2_enabled == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.build_dependency_level_2) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ai-canary-plan
          path: nightly-plan
      - id: dependencies
        env:
          SOURCE: ${{ matrix.source }}
        run: python3 scripts/nightly-plan.py --catalog nightly-plan/catalog.json --dependency-pattern "$SOURCE"
      - uses: actions/download-artifact@v4
        if: steps.dependencies.outputs.needed == 'true'
        with:
          pattern: ${{ steps.dependencies.outputs.pattern }}
          path: downloads
          merge-multiple: true
      - name: Unpack same-run producers
        run: |
          mkdir -p inputs outputs
          for bundle in downloads/*.tar.gz; do
            [ -f "$bundle" ] || continue
            directory="inputs/$(basename "$bundle" .tar.gz)"
            mkdir -p "$directory"
            tar -xzf "$bundle" -C "$directory" --no-same-owner
          done
      - name: Check producers before provisioning builder
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          PYTHONPATH=src python3 scripts/nightly-build.py --check-dependencies-only \
            --source "$SOURCE" --catalog nightly-plan/catalog.json --inputs inputs --output outputs \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Prepare Resolute builder
        run: |
          set -o pipefail
          bash scripts/prepare-builder.sh resolute 2>&1 | tee outputs/prepare-builder.log
      - name: Build, test, and attempt up to three local repairs
        uses: ./.github/actions/build-test-remediate
        with:
          source: ${{ matrix.source }}
