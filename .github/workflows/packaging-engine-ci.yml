name: Packaging engine CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      build_case:
        description: Pinned packaging regression case
        type: choice
        options: [all, baseline, update, snapshot, dependency, uca, glance, resolved-snapshot]
        default: all
        required: true
permissions:
  contents: read
jobs:
  quality:
    name: Python quality and installed wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src scripts tests
      - run: ruff format --check src/packagetest/contracts.py src/packagetest/relations.py src/packagetest/prepared_plan.py src/packagetest/prepared_source.py src/packagetest/upstream_dependencies.py
      - run: python -m mypy
      - run: python scripts/check-complexity.py
      - run: bandit -r src scripts -lll -q
      - run: pip-audit .
      - run: bash scripts/check-installed-package.sh

  unit:
    name: Pure Python unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o DPkg::Lock::Timeout=300
          )
          for attempt in 1 2 3; do
            if sudo timeout --signal=TERM --kill-after=30s 5m \
                apt-get "${apt_options[@]}" update; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          sudo timeout --signal=TERM --kill-after=30s 10m \
            env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" \
            install -y python3-packaging python3-pytest python3-tomlkit python3-yaml dpkg-dev
          PYTHONPATH=src python3 -m pytest -q -m "not packaging_component"

  packaging-component:
    name: Packaging component tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python and Debian packaging test dependencies
        run: |
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o DPkg::Lock::Timeout=300
          )
          for attempt in 1 2 3; do
            if sudo timeout --signal=TERM --kill-after=30s 5m \
                apt-get "${apt_options[@]}" update; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          sudo timeout --signal=TERM --kill-after=30s 10m \
            env DEBIAN_FRONTEND=noninteractive apt-get "${apt_options[@]}" \
            install -y python3-packaging python3-pytest python3-tomlkit quilt python3-yaml dpkg-dev
      - name: Run Debian packaging component tests
        run: PYTHONPATH=src python3 -m pytest -q -m packaging_component

  build:
    name: Packaging regression ${{ matrix.build_case }}
    needs: [quality, unit, packaging-component]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        build_case: ${{ fromJSON(inputs.build_case && inputs.build_case != 'all' && format('["{0}"]', inputs.build_case) || '["baseline","snapshot","uca"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated builder
        env:
          BUILD_CASE: ${{ matrix.build_case }}
        run: |
          target=noble
          case "$BUILD_CASE" in
            snapshot|dependency|resolved-snapshot) target=stonking ;;
            uca|glance) target=noble-uca-epoxy ;;
          esac
          mkdir -p artifacts
          set -o pipefail
          bash scripts/prepare-builder.sh "$target" 2>&1 | tee artifacts/prepare-builder.log
      - name: Build, validate, and install pinned packages
        env:
          BUILD_CASE: ${{ matrix.build_case }}
          RUN_LIBRARY_SKIP_TESTS: 1
        run: bash scripts/run-library.sh "$BUILD_CASE"
      - name: Verify failed dependency blocks its consumer
        if: matrix.build_case == 'dependency'
        run: sg sbuild -c '.venv/bin/python scripts/test-dependency-failure.py config/locks/pbr-oslo-i18n-stonking.json'
      - name: Summarize failures
        if: always()
        continue-on-error: true
        run: python3 scripts/summarize_packaging_failures.py artifacts
      - name: Bundle portable artifact payload
        if: always()
        env:
          BUILD_CASE: ${{ matrix.build_case }}
        run: |
          mkdir -p artifacts
          # Preserve sbuild's colon-bearing log names and symlinks inside a tar.
          tar --exclude='*/work' --exclude='./environment.lock' \
            -C artifacts -czf "$RUNNER_TEMP/packaging-$BUILD_CASE.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaging-${{ matrix.build_case }}
          path: ${{ runner.temp }}/packaging-${{ matrix.build_case }}.tar.gz
          if-no-files-found: error
