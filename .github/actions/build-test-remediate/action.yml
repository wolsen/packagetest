name: Build, test, and repair snapshot
description: Build one source, run autopkgtest, and locally repair failures before publication
inputs:
  source:
    description: Source package to build
    required: true
  target-id:
    description: Frozen snapshot target identifier used to isolate artifacts
    required: true
  suite:
    description: Ubuntu suite used by the autopkgtest image
    required: true
  autopkgtest-cache-key:
    description: Immutable Actions cache key for the target suite's prepared QEMU image
    required: true
  builder-ready:
    description: Whether host provisioning and cached chroot registration succeeded
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - id: autopkgtest_image
      name: Restore prepared ${{ inputs.suite }} autopkgtest image
      if: inputs.builder-ready == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/.cache/autopkgtest/${{ inputs.suite }}-amd64
        key: ${{ inputs.autopkgtest-cache-key }}
        fail-on-cache-miss: true

    - name: Select cached autopkgtest image
      if: inputs.builder-ready == 'true'
      shell: bash
      run: |
        test "${{ steps.autopkgtest_image.outputs.cache-hit }}" = true
        echo "AUTOPKGTEST_IMAGE_CACHE=${{ github.workspace }}/.cache/autopkgtest/${{ inputs.suite }}-amd64" >> "$GITHUB_ENV"

    - id: initial_build
      name: Build snapshot against this run's producers
      if: inputs.builder-ready == 'true'
      continue-on-error: true
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
      run: |
        set -o pipefail
        sg sbuild -c 'PYTHONPATH=src python3 scripts/nightly-build.py \
          --source "$SOURCE" --catalog nightly-plan/catalog.json --inputs inputs --output outputs \
          --prepared-source outputs/source-preparation \
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"' 2>&1 | tee outputs/nightly-build.log

    - id: initial_test
      name: Run installed-package tests
      if: inputs.builder-ready == 'true'
      continue-on-error: true
      shell: bash
      run: bash scripts/test-built-snapshot.sh "${{ inputs.source }}"

    - id: ai_cache
      name: Restore local AI only for a failed package
      if: inputs.builder-ready == 'true' && (steps.initial_build.outcome == 'failure' || steps.initial_test.outcome == 'failure')
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/.cache/packagetest-ai
        key: local-ai-llama-b10964-qwen25-coder-7b-q4km-v1
        fail-on-cache-miss: false

    - id: remediation
      name: Make up to three local AI repair, rebuild, and retest attempts
      if: inputs.builder-ready == 'true' && (steps.initial_build.outcome == 'failure' || steps.initial_test.outcome == 'failure')
      continue-on-error: true
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        AI_CACHE: ${{ github.workspace }}/.cache/packagetest-ai
        MODEL_SHA256: 509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c
      run: |
        set -uo pipefail
        report="ai-remediation/$SOURCE"
        mkdir -p "$report"
        llama_cli="$(find "$AI_CACHE/runtime" -type f -name llama-cli -print -quit 2>/dev/null || true)"
        if [[ -z "$llama_cli" || ! -f "$AI_CACHE/model.gguf" ]]; then
          printf '{"source":"%s","result":"AI_UNAVAILABLE","error":"Pinned runtime cache was unavailable"}\n' "$SOURCE" > "$report/result.json"
          printf '## %s local AI remediation: AI_UNAVAILABLE\n\nThe pinned runtime cache was unavailable.\n' "$SOURCE" > "$report/summary.md"
          cat "$report/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        PYTHONPATH=src python3 scripts/remediate-package.py \
          --source "$SOURCE" --catalog nightly-plan/catalog.json --inputs inputs \
          --outputs outputs --tests test-results --report "$report" \
          --work "$RUNNER_TEMP/ai-remediation-$SOURCE" --llama-cli "$llama_cli" \
          --model "$AI_CACHE/model.gguf" --model-sha256 "$MODEL_SHA256" \
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

    - name: Record infrastructure failures without a build manifest
      if: always()
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
      run: |
        mkdir -p outputs test-results/result
        if [[ ! -f outputs/result.json ]]; then
          SOURCE="$SOURCE" python3 -c 'import json,os; open("outputs/result.json", "w").write(json.dumps({"source":os.environ["SOURCE"],"result":"INFRA_ERROR","error":"Build did not reach executor; inspect job logs"}))'
        fi
        if [[ ! -f test-results/result/result.json ]]; then
          SOURCE="$SOURCE" python3 -c 'import json,os; open("test-results/result/result.json", "w").write(json.dumps({"source":os.environ["SOURCE"],"result":"BLOCKED","error":"No tested build candidate"}))'
        fi

    - name: Record packaging proposal validation
      if: always()
      shell: bash
      run: |
        python3 scripts/finalize-packaging-proposal.py \
          outputs/source-preparation/packaging-proposal/packaging-proposal.json \
          outputs/result.json test-results/result/result.json

    - name: Summarize upstream evolution
      if: always() && hashFiles('outputs/source-preparation/packaging-proposal/source-evolution.md') != ''
      shell: bash
      run: cat outputs/source-preparation/packaging-proposal/source-evolution.md >> "$GITHUB_STEP_SUMMARY"

    - name: Record producer build-and-test readiness
      if: always()
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
      run: |
        python3 scripts/package-readiness.py \
          --source "$SOURCE" --outputs outputs \
          --build outputs/result.json --autopkgtest test-results/result/result.json \
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

    - id: publication
      name: Stage compact reports and conditional package payloads
      if: always()
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
      run: |
        sudo python3 scripts/publish-package-artifacts.py \
          --source "$SOURCE" --outputs outputs --tests test-results \
          --remediation "ai-remediation/$SOURCE" --output publication \
          --github-output "$GITHUB_OUTPUT"
        sudo chmod -R a+rX publication

    - uses: actions/upload-artifact@v4
      if: always() && steps.publication.outputs.producer == 'true'
      with:
        name: build-${{ inputs.target-id }}-${{ inputs.source }}
        path: publication/producer/*.tar.gz
        retention-days: 14
        if-no-files-found: error

    - id: upload_report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: package-report-${{ inputs.target-id }}-${{ inputs.source }}
        path: publication/report/
        retention-days: 14
        if-no-files-found: error

    - id: upload_diagnostics
      uses: actions/upload-artifact@v4
      if: always() && steps.publication.outputs.diagnostics == 'true'
      with:
        name: diagnostics-${{ inputs.target-id }}-${{ inputs.source }}
        path: publication/diagnostics/*.tar.gz
        retention-days: 14
        if-no-files-found: error

    - name: Link the package report and proposals for human review
      if: always() && steps.upload_report.outputs.artifact-url != ''
      shell: bash
      env:
        ARTIFACT_URL: ${{ steps.upload_report.outputs.artifact-url }}
        SOURCE: ${{ inputs.source }}
      run: printf '\n[Download the results, source evolution, and packaging proposal for `%s`](%s) — human review and target selection are required for any candidate patch or binary-package split.\n' "$SOURCE" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

    - name: Link full failure diagnostics
      if: always() && steps.upload_diagnostics.outputs.artifact-url != ''
      shell: bash
      env:
        ARTIFACT_URL: ${{ steps.upload_diagnostics.outputs.artifact-url }}
        SOURCE: ${{ inputs.source }}
      run: printf '\n[Download build, test, and AI failure evidence for `%s`](%s)\n' "$SOURCE" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

    - name: Enforce the final build and test result
      if: always()
      shell: bash
      run: python3 scripts/final-package-verdict.py outputs/result.json test-results/result/result.json
